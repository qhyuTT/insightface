services:
  person-search:
    build:
      context: ..
      dockerfile: Dockerfile.rk3588
      args:
        VCS_REF: ${PERSON_SEARCH_BUILD_REVISION:-unknown}
        BASE_IMAGE: ${PERSON_SEARCH_BASE_IMAGE:-ubuntu:20.04}
    image: person-search-rk3588-rpp:${PERSON_SEARCH_IMAGE_TAG:-stage}
    container_name: person-search-rk3588-rpp
    network_mode: host
    # The host rpp_server attaches SysV shared-memory IDs created by pyrt.
    # A private IPC namespace makes those IDs invalid in the server process.
    ipc: host
    # MPP reads /proc/device-tree/compatible to select RK3588's H.265 decoder.
    # Docker masks /sys/firmware by default, breaking that /proc symlink.
    security_opt:
      - label=disable
      - systempaths=unconfined
    cpuset: "4-7"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      # Must contain PERSON_SEARCH_EVIDENCE_API_KEY matching dispatch's
      # DISPATCH_INSIGHTFACE_EVIDENCE_API_KEY; Compose requires it and the
      # health check verifies the advertised capability.
      - path: ${PERSON_SEARCH_RUNTIME_ENV_FILE:-/ssd/person-search-rpp/runtime.env}
        required: true
    environment:
      PERSON_SEARCH_HOST: 0.0.0.0
      PERSON_SEARCH_PORT: ${PERSON_SEARCH_PORT:-18080}
      PERSON_SEARCH_INFERENCE_BACKEND: hybrid
      PERSON_SEARCH_PREFER_CUDA: "false"
      PERSON_SEARCH_INSIGHTFACE_ROOT: /models/.insightface
      PERSON_SEARCH_VIDEO_BACKEND: gstreamer
      PERSON_SEARCH_RPP_STATIC_MODEL_DIR: /models/rpp-static
      PERSON_SEARCH_RPP_ENGINE_CACHE_DIR: /models/rpp-cache
      PERSON_SEARCH_RPP_ENGINE_CACHE_ENABLED: "false"
      PERSON_SEARCH_RPP_FACE_DETECTION_WIDTH: "1280"
      PERSON_SEARCH_RPP_FACE_DETECTION_HEIGHT: "736"
      PERSON_SEARCH_RPP_ENROLLMENT_FACE_DETECTION_WIDTH: "640"
      PERSON_SEARCH_RPP_ENROLLMENT_FACE_DETECTION_HEIGHT: "640"
      PERSON_SEARCH_RKNN_RUNTIME_LIBRARY: /opt/rknn-runtime/librknnrt.so
      PERSON_SEARCH_RKNN_YOLOX_MODEL: /opt/rknn-models/yolox_tiny_640x384.rknn
      PERSON_SEARCH_RKNN_FACE_DETECTION_MODEL: /opt/rknn-models/scrfd_10g_1280x736_int8.rknn
      PERSON_SEARCH_RKNN_ENROLLMENT_FACE_DETECTION_MODEL: /opt/rknn-models/scrfd_10g_640.rknn
      PERSON_SEARCH_RKNN_FACE_RECOGNITION_MODEL: /opt/rknn-models/w600k_r50.rknn
      PERSON_SEARCH_PERSON_INPUT_WIDTH: "640"
      PERSON_SEARCH_PERSON_INPUT_HEIGHT: "384"
      PERSON_SEARCH_RKNN_CORE_MASK: "7"
      PERSON_SEARCH_FACE_DETECTION_SIZE: "640"
      PERSON_SEARCH_ENROLLMENT_DETECTION_SIZE: "640"
      PERSON_SEARCH_FACE_DETECTION_EXTRA_SCALE_CPU: "0"
      PERSON_SEARCH_FACE_DEEP_SCAN_EVERY_N: "1"
      PERSON_SEARCH_TINY_FACE_ENABLED: "true"
      PERSON_SEARCH_TINY_FACE_SHADOW_MODE: "true"
      PERSON_SEARCH_EMBEDDING_FLIP_TTA: "true"
      PERSON_SEARCH_CAMERA_MOTION_COMPENSATION: "false"
      PERSON_SEARCH_STAGGER_FULL_FRAME_DETECTION: "true"
      PERSON_SEARCH_PERSON_DETECTION_HZ_CUDA: "4"
      PERSON_SEARCH_FACE_DETECTION_HZ_CUDA: "4"
      PERSON_SEARCH_TARGET_LOOP_HZ: "4"
      PERSON_SEARCH_MIN_PROCESSED_FPS: "2"
      # Preview has an independent newest-frame path. Keep this configurable
      # for measured 5/10/15/20 Hz comparisons without touching AI accuracy.
      PERSON_SEARCH_PREVIEW_HZ: ${PERSON_SEARCH_PREVIEW_HZ:-15}
      PERSON_SEARCH_MATCH_PROFILE: transit
      PERSON_SEARCH_FACE_TRACK_BUFFER_SECONDS: "2.5"
      PERSON_SEARCH_GSTREAMER_PYTHON: /usr/bin/python3
      PERSON_SEARCH_GSTREAMER_HELPER: /app/scripts/rk3588_gstreamer_capture.py
      PERSON_SEARCH_GSTREAMER_LATENCY_MS: "500"
      PERSON_SEARCH_GSTREAMER_DROP_ON_LATENCY: "false"
      PERSON_SEARCH_GSTREAMER_OUTPUT_FORMAT: nv12
      PERSON_SEARCH_GSTREAMER_NV12_CONVERTER: auto
      PERSON_SEARCH_GSTREAMER_RTSP_CODEC: auto
      PERSON_SEARCH_RTSP_TRANSPORT: tcp
      PERSON_SEARCH_RGA_RUNTIME_LIBRARY: /lib/aarch64-linux-gnu/librga.so.2
      GST_PLUGIN_PATH: /usr/local/lib/aarch64-linux-gnu/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/gstreamer-1.0
      GST_PLUGIN_SYSTEM_PATH_1_0: /usr/local/lib/aarch64-linux-gnu/gstreamer-1.0
      PYTHONUNBUFFERED: "1"
    devices:
      - /dev/rpp0_entire_ctrl:/dev/rpp0_entire_ctrl
      - /dev/ve0_entire_ctrl:/dev/ve0_entire_ctrl
      - /dev/dri/card1:/dev/dri/card1
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/renderD129:/dev/dri/renderD129
      - /dev/mpp_service:/dev/mpp_service
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/system-dma32:/dev/dma_heap/system-dma32
      - /dev/dma_heap/system-uncached:/dev/dma_heap/system-uncached
      - /dev/dma_heap/system-uncached-dma32:/dev/dma_heap/system-uncached-dma32
      - /dev/dma_heap/cma:/dev/dma_heap/cma
      - /dev/dma_heap/cma-uncached:/dev/dma_heap/cma-uncached
      - /dev/rga:/dev/rga
    volumes:
      - ${PERSON_SEARCH_RPP_ROOT:-/ssd/person-search-rpp}/models:/models/.insightface/models:ro
      - ${PERSON_SEARCH_RPP_ROOT:-/ssd/person-search-rpp}/models/rpp-static:/models/rpp-static:ro
      - ${PERSON_SEARCH_RPP_ROOT:-/ssd/person-search-rpp}/cache:/models/rpp-cache
      - /ssd/person-search/runtime:/opt/rknn-runtime:ro
      - /ssd/person-search/models/rk3588:/opt/rknn-models:ro
      - /usr/local/rpp/lib:/usr/local/rpp/lib:ro
      - /usr/local/rpp/include:/usr/local/rpp/include:ro
      - /usr/local/lib/aarch64-linux-gnu:/usr/local/lib/aarch64-linux-gnu:ro
      - /sys/firmware/devicetree/base:/sys/firmware/devicetree/base:ro
      - /usr/lib/aarch64-linux-gnu/libjsoncpp.so.1.7.4:/lib/aarch64-linux-gnu/libjsoncpp.so.1:ro
      - /lib/aarch64-linux-gnu/librockchip_mpp.so.0:/lib/aarch64-linux-gnu/librockchip_mpp.so.1:ro
      - /lib/aarch64-linux-gnu/librga.so.2.1.0:/lib/aarch64-linux-gnu/librga.so.2:ro
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - /app/scripts/check_rk3588_contract.py
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
